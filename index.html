<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container { max-width: 1050px; margin: 0 auto; padding: 32px 18px 50px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 20px; margin-bottom: 24px;
    }
    h1 { margin: 0 0 5px; font-size: 32px; }
    .subtitle { margin: 0; color: #6b7280; }
    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px;
    }
    .stat {
      background: white; padding: 18px; border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }
    .stat strong { display: block; font-size: 26px; margin-top: 5px; }
    .toolbar {
      background: white; padding: 16px; border-radius: 14px; margin-bottom: 18px;
      display: flex; gap: 10px; flex-wrap: wrap;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }
    input, select, button {
      font: inherit; border-radius: 9px; padding: 10px 12px;
    }
    input, select { border: 1px solid #d1d5db; background: white; }
    #search { flex: 1; min-width: 220px; }
    button { border: 0; cursor: pointer; background: #2563eb; color: white; font-weight: 600; }
    button:hover { opacity: .9; }
    .secondary { background: #e5e7eb; color: #111827; }
    .danger { background: #dc2626; }
    .books { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .book {
      background: white; border-radius: 14px; padding: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
      display: flex; flex-direction: column; gap: 10px;
    }
    .book h3 { margin: 0; font-size: 20px; }
    .author { color: #6b7280; }
    .badge {
      display: inline-block; width: fit-content; padding: 5px 9px;
      border-radius: 999px; font-size: 12px; font-weight: 700;
      background: #dbeafe; color: #1d4ed8;
    }
    .badge.reading { background: #fef3c7; color: #92400e; }
    .badge.completed { background: #dcfce7; color: #166534; }
    .notes { color: #4b5563; font-size: 14px; min-height: 20px; }
    .actions { display: flex; gap: 8px; margin-top: auto; }
    .actions button { flex: 1; font-size: 14px; }
    .empty {
      grid-column: 1/-1; text-align: center; padding: 45px;
      color: #6b7280; background: white; border-radius: 14px;
    }
    dialog {
      border: 0; border-radius: 16px; padding: 0; width: min(500px, 92vw);
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .modal { padding: 24px; }
    .modal h2 { margin-top: 0; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field input, .field select, .field textarea { width: 100%; }
    textarea { min-height: 80px; resize: vertical; padding: 10px; border: 1px solid #d1d5db; border-radius: 9px; font: inherit; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    @media (max-width: 800px) {
      .books { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .books, .stats { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>📚 My Book Tracker</h1>
        <p class="subtitle">Keep track of books you want to read, are reading, and have finished.</p>
      </div>
      <button id="addBtn">+ Add Book</button>
    </header>

    <section class="stats">
      <div class="stat">Total<strong id="total">0</strong></div>
      <div class="stat">To Read<strong id="toRead">0</strong></div>
      <div class="stat">Reading<strong id="reading">0</strong></div>
      <div class="stat">Completed<strong id="completed">0</strong></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search by title or author..." />
      <select id="filter">
        <option value="all">All books</option>
        <option value="to-read">To Read</option>
        <option value="reading">Reading</option>
        <option value="completed">Completed</option>
      </select>
      <button class="secondary" id="clearBtn">Clear All</button>
    </section>

    <main id="books" class="books"></main>
  </div>

  <dialog id="bookDialog">
    <form id="bookForm" class="modal">
      <h2 id="modalTitle">Add a Book</h2>
      <input type="hidden" id="bookId" />
      <div class="field">
        <label for="title">Book Title</label>
        <input id="title" required placeholder="e.g. Atomic Habits" />
      </div>
      <div class="field">
        <label for="author">Author</label>
        <input id="author" required placeholder="e.g. James Clear" />
      </div>
      <div class="field">
        <label for="status">Status</label>
        <select id="status">
          <option value="to-read">To Read</option>
          <option value="reading">Reading</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Optional notes..."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="secondary" id="cancelBtn">Cancel</button>
        <button type="submit">Save Book</button>
      </div>
    </form>
  </dialog>

  <script>
    const STORAGE_KEY = "bookTrackerBooks";
    let books = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    const $ = id => document.getElementById(id);
    const dialog = $("bookDialog");

    function saveBooks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
    }

    function statusLabel(status) {
      return { "to-read": "To Read", reading: "Reading", completed: "Completed" }[status];
    }

    function render() {
      const query = $("search").value.toLowerCase().trim();
      const filter = $("filter").value;

      const visible = books.filter(book => {
        const matchesText = book.title.toLowerCase().includes(query) ||
                            book.author.toLowerCase().includes(query);
        const matchesFilter = filter === "all" || book.status === filter;
        return matchesText && matchesFilter;
      });

      $("total").textContent = books.length;
      $("toRead").textContent = books.filter(b => b.status === "to-read").length;
      $("reading").textContent = books.filter(b => b.status === "reading").length;
      $("completed").textContent = books.filter(b => b.status === "completed").length;

      if (!visible.length) {
        $("books").innerHTML = `<div class="empty">No books found. Click <b>+ Add Book</b> to get started.</div>`;
        return;
      }

      $("books").innerHTML = visible.map(book => `
        <article class="book">
          <span class="badge ${book.status}">${statusLabel(book.status)}</span>
          <h3>${escapeHtml(book.title)}</h3>
          <div class="author">by ${escapeHtml(book.author)}</div>
          <div class="notes">${escapeHtml(book.notes || "No notes added.")}</div>
          <div class="actions">
            <button class="secondary" onclick="editBook('${book.id}')">Edit</button>
            <button class="danger" onclick="deleteBook('${book.id}')">Delete</button>
          </div>
        </article>
      `).join("");
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[char]));
    }

    $("addBtn").addEventListener("click", () => {
      $("bookForm").reset();
      $("bookId").value = "";
      $("modalTitle").textContent = "Add a Book";
      dialog.showModal();
    });

    $("cancelBtn").addEventListener("click", () => dialog.close());

    $("bookForm").addEventListener("submit", event => {
      event.preventDefault();

      const id = $("bookId").value;
      const book = {
        id: id || Date.now().toString(),
        title: $("title").value.trim(),
        author: $("author").value.trim(),
        status: $("status").value,
        notes: $("notes").value.trim()
      };

      if (id) {
        books = books.map(item => item.id === id ? book : item);
      } else {
        books.push(book);
      }

      saveBooks();
      render();
      dialog.close();
    });

    window.editBook = function(id) {
      const book = books.find(item => item.id === id);
      if (!book) return;

      $("bookId").value = book.id;
      $("title").value = book.title;
      $("author").value = book.author;
      $("status").value = book.status;
      $("notes").value = book.notes;
      $("modalTitle").textContent = "Edit Book";
      dialog.showModal();
    };

    window.deleteBook = function(id) {
      const book = books.find(item => item.id === id);
      if (!book) return;
      if (confirm(`Delete "${book.title}"?`)) {
        books = books.filter(item => item.id !== id);
        saveBooks();
        render();
      }
    };

    $("search").addEventListener("input", render);
    $("filter").addEventListener("change", render);

    $("clearBtn").addEventListener("click", () => {
      if (!books.length) return;
      if (confirm("Delete all books?")) {
        books = [];
        saveBooks();
        render();
      }
    });

    render();
  </script>
</body>
</html>
